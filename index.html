<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Control Assembly Line - Jozu Auto Part Co., Ltd.</title>
    <!-- Bootstrap CSS & Chart.js -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header Bar -->
    <nav class="navbar navbar-custom px-4 py-3">
        <div class="container-fluid p-0 d-flex justify-content-between align-items-center">
            <div>
                <div class="d-flex align-items-center gap-2 mb-1">
                    <h3 class="m-0 text-white fw-bold">⚙️ Production-Control-Assembly-Line</h3>
                    <span class="badge badge-honda px-2 py-1">THAI HONDA</span>
                </div>
                <div class="small text-light">Jozu Auto Part Co., Ltd. - ระบบควบคุมกระบวนการผลิตและงานประกอบ (Assembly Visual Control)</div>
            </div>
            <div class="text-warning fw-bold fs-5" id="clock"></div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-3">
        <!-- 10 Modules Embossed Navigation Bar -->
        <ul class="nav-main-grid">
            <li><button class="nav-btn active" onclick="switchTab('tab-dashboard', this)">Dashboard</button></li>
            <li><button class="nav-btn" onclick="switchTab('tab-planning', this)">Planning</button></li>
            <li><button class="nav-btn" onclick="switchTab('tab-capacity', this)">Capacity</button></li>
            <li><button class="nav-btn" onclick="switchTab('tab-component', this)">รับ component<br>ส่งชุบ - รับชุบ</button></li>
            <li><button class="nav-btn" onclick="switchTab('tab-plating', this)">Plating</button></li>
            <li><button class="nav-btn" onclick="switchTab('tab-stock-component', this)">Stock Component</button></li>
            <li><button class="nav-btn" onclick="switchTab('tab-report', this)">รายงานการผลิต</button></li>
            <li><button class="nav-btn" onclick="switchTab('tab-stock-fg', this)">Stock F/G</button></li>
            <li><button class="nav-btn" onclick="switchTab('tab-delivery', this)">Delivery</button></li>
            <li><button class="nav-btn" onclick="switchTab('tab-pm', this)">PM Machine /Jig</button></li>
        </ul>

        <!-- Content Container -->
        <div id="modules-container">
            <!-- โหลดเนื้อหาจาก modules.html มาวางที่นี่ -->
        </div>
    </div>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
